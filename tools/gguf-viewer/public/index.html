<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>llama-gguf-viewer</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Inter", "Segoe UI", sans-serif;
            background-color: #04060c;
            color: #dbe1f2;
        }
        body {
            margin: 0;
            background-color: inherit;
            color: inherit;
        }
        main {
            width: 100%;
            box-sizing: border-box;
            padding: 0.85rem 1rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.5rem 0;
            width: 100%;
        }
        h2 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #8ea2c8;
        }
        .tabs {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.6rem 1rem;
            background: transparent;
            width: 100%;
            box-sizing: border-box;
        }
        .tab-button {
            border: none;
            background: transparent;
            color: #7c8ea9;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            font-weight: 500;
        }
        .tab-button:focus-visible {
            outline: 1px solid #38bdf8;
            outline-offset: 2px;
        }
        .tab-button:hover {
            color: #cad6ef;
        }
        .tab-button--active {
            color: #f5f7ff;
            text-decoration: underline;
            text-decoration-thickness: 0.12em;
            text-underline-offset: 0.35em;
        }
        .page {
            display: none;
        }
        .page--active {
            display: block;
        }
        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 0.6rem;
        }
        .info-card {
            background: #0a101c;
            padding: 0.65rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .info-card h3 {
            margin: 0;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #8ea2c8;
        }
        .info-card p {
            margin: 0;
            font-size: 1.1rem;
            color: #f1f5ff;
        }
        .model-title {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: baseline;
        }
        .model-path {
            font-size: 0.8rem;
            color: #9fb4d9;
            background: #0a111f;
            padding: 0.2rem 0.45rem;
        }
        .table-wrapper {
            background: #060a13;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        thead {
            background: #050910;
        }
        th, td {
            padding: 0.45rem 0.65rem;
            text-align: left;
            vertical-align: top;
        }
        tbody tr:nth-of-type(2n) {
            background: #081020;
        }
        thead th {
            font-size: 0.72rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #8ea2c8;
        }
        code {
            font-family: "Fira Code", "Menlo", monospace;
            background: #0b1220;
            color: #f4f7ff;
            padding: 0.1rem 0.3rem;
        }
        button {
            background: #0f1625;
            border: none;
            color: inherit;
            padding: 0.3rem 0.65rem;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
        }
        button:hover:not(:disabled) {
            color: #f3f5ff;
            background: #162238;
        }
        button:disabled {
            color: #5d6983;
            cursor: not-allowed;
            background: #0f1625;
            opacity: 0.6;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem;
        }
        input,
        select {
            background: #0a1321;
            border: none;
            color: inherit;
            padding: 0.28rem 0.4rem;
            font-size: 0.82rem;
        }
        input:focus,
        select:focus {
            outline: 1px solid #38bdf8;
            outline-offset: 1px;
        }
        .heatmap-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem;
        }
        .heatmap-controls label {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.78rem;
        }
        .heatmap-controls select,
        .heatmap-controls input[type="number"] {
            width: 5rem;
        }
        .heatmap-controls select {
            min-width: 18rem;
        }
        .heatmap-controls .button-group {
            display: inline-flex;
            gap: 0.35rem;
        }
        .heatmap-visualization {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
        }
        .histogram-canvas-wrapper {
            position: relative;
            background: #000;
            width: 100%;
            height: 512px;
            box-sizing: border-box;
        }
        #histogram-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }
        .histogram-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1rem;
            background: rgba(4, 8, 15, 0.78);
            color: #cdd9f4;
            font-size: 0.85rem;
        }
        .histogram-overlay[hidden] {
            display: none;
        }
        .histogram-overlay--error {
            background: rgba(168, 34, 70, 0.6);
            color: #ffe4ef;
        }
        .histogram-overlay--loading {
            background: rgba(26, 86, 219, 0.5);
            color: #e5f2ff;
        }
        .heatmap-canvas-wrapper {
            position: relative;
            background: #060b13;
            width: 100%;
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        #heatmap-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            image-rendering: pixelated;
            touch-action: none;
        }
        #heatmap-canvas.heatmap-canvas--dragging {
            cursor: grabbing;
        }
        .heatmap-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            text-align: center;
            font-size: 0.9rem;
            background: rgba(4, 8, 15, 0.78);
            color: #cdd9f4;
        }
        .heatmap-overlay[hidden] {
            display: none;
        }
        .heatmap-overlay--error {
            background: rgba(168, 34, 70, 0.6);
            color: #ffe4ef;
        }
        .heatmap-overlay--loading {
            background: rgba(26, 86, 219, 0.5);
            color: #e5f2ff;
        }
        .heatmap-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
        }
        .heatmap-tooltip {
            position: absolute;
            max-width: 320px;
            padding: 0.75rem 0.85rem;
            background: rgba(12, 17, 27, 0.92);
            color: #f4f8ff;
            box-shadow: 0 0.7rem 1.8rem rgba(0, 0, 0, 0.35);
            pointer-events: none;
            font-size: 0.78rem;
            line-height: 1.35;
            z-index: 5;
        }
        .heatmap-tooltip__title {
            font-weight: 600;
            margin-bottom: 0.35rem;
            letter-spacing: 0.015em;
        }
        .heatmap-tooltip__grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.2rem 0.75rem;
        }
        .heatmap-tooltip__label {
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
        }
        .heatmap-tooltip__value {
            text-align: right;
            white-space: nowrap;
        }
        .heatmap-tooltip__value--wrap {
            white-space: pre-wrap;
            word-break: break-word;
            text-align: left;
        }
        .heatmap-tooltip__value--left {
            text-align: left;
        }
        .tooltip-host {
            position: relative;
        }
        .heatmap-header-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #d3dcfb;
        }
        .heatmap-status {
            font-size: 0.75rem;
            color: #9fb4d9;
            white-space: nowrap;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.15rem 0.4rem;
            background: #132036;
            color: #a8bee5;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .tokenizer-controls {
            align-items: center;
        }
        .tokenizer-controls label {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .tokenizer-controls input[type="number"] {
            width: 5rem;
        }
        .token-grid {
            display: grid;
            gap: 0.25rem;
            margin-top: 0.6rem;
            position: relative;
        }
        .token-cell {
            background: #121c30;
            padding: 0.32rem 0.4rem;
            font-family: "Fira Code", "Menlo", monospace;
            font-size: 0.95rem;
            text-align: center;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .token-cell--empty {
            opacity: 0.35;
        }
        .model-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .model-item {
            display: flex;
        }
        .model-button {
            background: #101827;
            border: none;
            color: inherit;
            padding: 0.45rem 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            width: 100%;
            cursor: pointer;
        }
        .model-button[data-selected="true"] {
            background: #1c2941;
            color: #f1f5ff;
        }
        .model-button:hover {
            background: #162238;
        }
        .model-path-entry {
            font-size: 0.85rem;
            color: #f7f9ff;
            word-break: break-all;
            flex: 1;
            text-align: left;
        }
        .model-meta {
            font-size: 0.72rem;
            color: #8ea2c8;
        }
        .browser-info {
            font-size: 0.75rem;
            color: #8ea2c8;
        }
        .empty-note {
            font-size: 0.85rem;
            color: #8490a7;
            padding: 0.5rem 0;
        }
        .table-empty td {
            text-align: center;
            padding: 0.75rem;
            color: #8490a7;
        }
        .badge + .badge {
            margin-left: 0.35rem;
        }
</style>
</head>
<body>
<nav class="tabs" aria-label="Viewer sections">
    <button type="button" class="tab-button tab-button--active" data-target-page="browser">Browser</button>
    <button type="button" class="tab-button" data-target-page="metadata">Metadata</button>
    <button type="button" class="tab-button" data-target-page="tokenizer">Tokenizer</button>
    <button type="button" class="tab-button" data-target-page="tensors">Tensors</button>
    <button type="button" class="tab-button" data-target-page="heatmap">Heatmap</button>
</nav>
<main>
    <div class="page page--active" data-page-id="browser">
        <section>
            <h2 id="browser-title" class="model-title">
                GGUF Browser
                <span class="browser-info" id="model-browser-root" hidden></span>
            </h2>
            <div id="model-browser"></div>
        </section>
    </div>

    <div class="page" data-page-id="metadata">
        <section id="model-info">
            <h2 id="model-title" class="model-title">Model overview</h2>
            <div class="info-cards" id="info-cards"></div>
        </section>

        <section>
            <h2>Metadata (KV)</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Key</th>
                            <th>Type</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="kv-body"></tbody>
                </table>
            </div>
        </section>
    </div>

    <div class="page" data-page-id="tokenizer">
        <section class="tokenizer-section">
            <h2 id="tokenizer-title" class="model-title">Tokenizer</h2>
            <div id="tokenizer-content"></div>
        </section>
    </div>

    <div class="page" data-page-id="tensors">
        <section>
            <h2 id="tensors-title" class="model-title">Tensors</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Shape</th>
                            <th>Elements</th>
                            <th>Offset</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tensor-body"></tbody>
                </table>
            </div>
        </section>
    </div>

    <div class="page" data-page-id="heatmap">
        <section>
            <h2 id="heatmap-title" class="model-title">Heatmap</h2>
            <div class="heatmap-header">
                <div class="heatmap-header-title" id="heatmap-info">Select a tensor to open the heatmap viewer.</div>
            </div>
            <div class="heatmap-controls" id="heatmap-controls" hidden>
                <label>
                    <span>Tensor</span>
                    <select id="heatmap-tensor-select"></select>
                </label>
                <label>
                    <span>Slice</span>
                    <input type="number" id="heatmap-slice-input" min="1" value="1">
                </label>
                <label>
                    <span>Min</span>
                    <input type="number" id="heatmap-min-input" value="-1" step="0.0001">
                </label>
                <label>
                    <span>Max</span>
                    <input type="number" id="heatmap-max-input" value="1" step="0.0001">
                </label>
                <button id="heatmap-auto-button" type="button">Auto</button>
                <label>
                    <span>Step</span>
                    <input type="number" id="heatmap-step-input" value="0.001" step="0.0001">
                </label>
                <div class="button-group">
                    <button id="heatmap-widen-button" type="button">−</button>
                    <button id="heatmap-tighten-button" type="button">+</button>
                </div>
                <label class="heatmap-toggle">
                    <input type="checkbox" id="heatmap-gain-offset-toggle">
                    <span>Gain / Offset</span>
                </label>
                <label class="heatmap-toggle">
                    <input type="checkbox" id="heatmap-grid-toggle" checked>
                    <span>Quant Grid</span>
                </label>
                <span class="heatmap-status" id="heatmap-status" hidden></span>
            </div>
            <div class="heatmap-visualization">
                <div class="heatmap-canvas-wrapper">
                    <canvas id="heatmap-canvas" width="1024" height="1024"></canvas>
                    <div class="heatmap-tooltip" id="heatmap-tooltip" hidden></div>
                    <div class="heatmap-overlay" id="heatmap-overlay">Select a tensor to stream its weights.</div>
                </div>
                <div class="histogram-canvas-wrapper">
                    <canvas id="histogram-canvas" width="1024" height="512"></canvas>
                    <div class="histogram-overlay" id="histogram-overlay">Select a tensor to generate its histogram.</div>
                </div>
            </div>
        </section>
    </div>
</main>
<script>
const infoCards = document.getElementById("info-cards");
const modelTitle = document.getElementById("model-title");
const tokenizerTitle = document.getElementById("tokenizer-title");
const tensorsTitle = document.getElementById("tensors-title");
const heatmapTitle = document.getElementById("heatmap-title");
const kvBody = document.getElementById("kv-body");
const tokenizerContent = document.getElementById("tokenizer-content");
const tensorBody = document.getElementById("tensor-body");
const histogramCanvasWrapper = document.querySelector(".histogram-canvas-wrapper");
const histogramCanvas = document.getElementById("histogram-canvas");
const histogramOverlay = document.getElementById("histogram-overlay");
const HISTOGRAM_CANVAS_HEIGHT = 512;
const histogramCtx = histogramCanvas ? histogramCanvas.getContext("2d") : null;
if (histogramCtx) {
    histogramCtx.imageSmoothingEnabled = false;
}

const heatmapCanvas = document.getElementById("heatmap-canvas");
const heatmapCanvasWrapper = document.querySelector(".heatmap-canvas-wrapper");
const heatmapTooltip = document.getElementById("heatmap-tooltip");
const heatmapInfo = document.getElementById("heatmap-info");
const heatmapStatus = document.getElementById("heatmap-status");
const heatmapOverlay = document.getElementById("heatmap-overlay");
const heatmapControls = document.getElementById("heatmap-controls");
const heatmapTensorSelect = document.getElementById("heatmap-tensor-select");
const heatmapSliceInput = document.getElementById("heatmap-slice-input");
const heatmapMinInput = document.getElementById("heatmap-min-input");
const heatmapMaxInput = document.getElementById("heatmap-max-input");
const heatmapAutoButton = document.getElementById("heatmap-auto-button");
const heatmapStepInput = document.getElementById("heatmap-step-input");
const heatmapTightenButton = document.getElementById("heatmap-tighten-button");
const heatmapWidenButton = document.getElementById("heatmap-widen-button");
const heatmapGainOffsetToggle = document.getElementById("heatmap-gain-offset-toggle");
const heatmapGridToggle = document.getElementById("heatmap-grid-toggle");
const tabButtons = document.querySelectorAll(".tab-button");
const pageContainers = document.querySelectorAll(".page");
const modelBrowserContainer = document.getElementById("model-browser");
const modelBrowserRoot = document.getElementById("model-browser-root");
const sectionTitles = [
    { element: modelTitle, label: "Model overview" },
    { element: tokenizerTitle, label: "Tokenizer" },
    { element: tensorsTitle, label: "Tensors" },
    { element: heatmapTitle, label: "Heatmap" },
];
const heatmapCtx = heatmapCanvas.getContext("2d");
if (heatmapCtx) {
    heatmapCtx.imageSmoothingEnabled = false;
}

const initialUrlState = (() => {
    const params = new URLSearchParams(window.location.search);
    const getString = (key) => {
        const value = params.get(key);
        return value && value.length > 0 ? value : null;
    };
    const getInt = (key) => {
        const value = params.get(key);
        if (value === null) {
            return null;
        }
        const parsed = Number.parseInt(value, 10);
        return Number.isFinite(parsed) ? parsed : null;
    };
    const getFloat = (key) => {
        const value = params.get(key);
        if (value === null) {
            return null;
        }
        const parsed = Number.parseFloat(value);
        return Number.isFinite(parsed) ? parsed : null;
    };
    const getBool = (key) => {
        const value = params.get(key);
        if (value === null) {
            return null;
        }
        const lowered = value.toLowerCase();
        if (value === "1" || lowered === "true") {
            return true;
        }
        if (value === "0" || lowered === "false") {
            return false;
        }
        return null;
    };
    return {
        model: getString("model"),
        tensor: getString("tensor"),
        slice: getInt("slice"),
        min: getFloat("min"),
        max: getFloat("max"),
        grid: getBool("grid"),
        x: getInt("x"),
        y: getInt("y"),
    };
})();

const pendingHeatmapState = {
    tensor: initialUrlState.tensor,
    slice: Number.isInteger(initialUrlState.slice) ? Math.max(0, initialUrlState.slice - 1) : null,
    min: Number.isFinite(initialUrlState.min) ? initialUrlState.min : null,
    max: Number.isFinite(initialUrlState.max) ? initialUrlState.max : null,
    grid: typeof initialUrlState.grid === "boolean" ? initialUrlState.grid : null,
    x: Number.isFinite(initialUrlState.x) ? Math.max(0, initialUrlState.x) : null,
    y: Number.isFinite(initialUrlState.y) ? Math.max(0, initialUrlState.y) : null,
    applied: false,
};

if (heatmapGridToggle && typeof pendingHeatmapState.grid === "boolean") {
    heatmapGridToggle.checked = pendingHeatmapState.grid;
}

let urlSyncReady = false;
let currentModelPath = initialUrlState.model;

function updateUrlParams(updates, options = {}) {
    const { force = false } = options;
    if (!force && !urlSyncReady) {
        return;
    }
    const params = new URLSearchParams(window.location.search);
    let changed = false;
    for (const [key, value] of Object.entries(updates)) {
        if (value === null || value === undefined || value === "") {
            if (params.has(key)) {
                params.delete(key);
                changed = true;
            }
        } else {
            const stringValue = String(value);
            if (params.get(key) !== stringValue) {
                params.set(key, stringValue);
                changed = true;
            }
        }
    }
    if (!changed && !force) {
        return;
    }
    const query = params.toString();
    const newUrl = `${window.location.pathname}${query ? `?${query}` : ""}${window.location.hash}`;
    window.history.replaceState(null, "", newUrl);
}

function withModel(url, model = currentModelPath) {
    if (!model) {
        return url;
    }
    const [base, hashFragment] = url.split("#", 2);
    const separator = base.includes("?") ? "&" : "?";
    const next = `${base}${separator}model=${encodeURIComponent(model)}`;
    return hashFragment ? `${next}#${hashFragment}` : next;
}

function appendModelParam(params, model = currentModelPath) {
    if (!model) {
        return;
    }
    params.set("model", model);
}

function updateModelUrlState(options = {}) {
    const { force = false } = options;
    const value = typeof currentModelPath === "string" && currentModelPath.length > 0 ? currentModelPath : null;
    updateUrlParams({ model: value }, { force });
}

function updateHeatmapUrlState(options = {}) {
    const { force = false } = options;
    if (!force && !urlSyncReady) {
        return;
    }
    const updates = {
        tensor: null,
        slice: null,
        min: null,
        max: null,
        grid: heatmapState.gridVisible ? "1" : "0",
        x: null,
        y: null,
    };
    if (currentModelPath && heatmapState.tensor) {
        updates.tensor = heatmapState.tensor.name || null;
        const sliceValue = Number.isInteger(heatmapState.slice) ? heatmapState.slice + 1 : null;
        updates.slice = sliceValue && sliceValue > 0 ? sliceValue : null;
        updates.min = Number.isFinite(heatmapState.scaleMin) ? heatmapState.scaleMin : null;
        updates.max = Number.isFinite(heatmapState.scaleMax) ? heatmapState.scaleMax : null;
        updates.grid = heatmapState.gridVisible ? "1" : "0";
        updates.x = Number.isFinite(heatmapState.windowX) ? Math.max(0, Math.floor(heatmapState.windowX)) : null;
        updates.y = Number.isFinite(heatmapState.windowY) ? Math.max(0, Math.floor(heatmapState.windowY)) : null;
    }
    updateUrlParams(updates, { force });
}

function syncFullUrlState(options = {}) {
    updateModelUrlState(options);
    updateHeatmapUrlState(options);
}

const tooltipIntegerFormatter = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
const tooltipFloatFormatter = new Intl.NumberFormat(undefined, { maximumSignificantDigits: 6 });

let activeTooltipHost = heatmapCanvasWrapper || null;
if (activeTooltipHost) {
    activeTooltipHost.classList.add("tooltip-host");
}

function setTooltipHost(host) {
    if (!heatmapTooltip) {
        activeTooltipHost = null;
        return;
    }
    if (!host) {
        activeTooltipHost = null;
        return;
    }
    if (!host.classList.contains("tooltip-host")) {
        host.classList.add("tooltip-host");

function clearHistogramCanvas() {
    if (!histogramCtx || !histogramCanvas) {
        return;
    }
    histogramCtx.fillStyle = "#000";
    histogramCtx.fillRect(0, 0, histogramCanvas.width, histogramCanvas.height);
}

function setHistogramOverlay(message, mode = "idle") {
    if (!histogramOverlay) {
        return;
    }
    if (!message) {
        histogramOverlay.hidden = true;
        histogramOverlay.textContent = "";
        histogramOverlay.className = "histogram-overlay";
        return;
    }
    histogramOverlay.hidden = false;
    histogramOverlay.textContent = message;
    histogramOverlay.className = `histogram-overlay${mode !== "idle" ? ` histogram-overlay--${mode}` : ""}`;
}

function drawHistogram() {
    if (!histogramCtx || !histogramCanvas) {
        return;
    }

    const width = histogramCanvas.width;
    const height = histogramCanvas.height;
    histogramCtx.fillStyle = "#000";
    histogramCtx.fillRect(0, 0, width, height);

    const bins = Array.isArray(histogramState.bins) ? histogramState.bins : [];
    const maxCount = histogramState.maxCount;

    if (!Array.isArray(bins) || bins.length === 0 || !Number.isFinite(maxCount) || maxCount <= 0) {
        return;
    }

    const binWidth = width / bins.length;
    histogramCtx.fillStyle = "#fff";
    for (let i = 0; i < bins.length; ++i) {
        const raw = bins[i];
        const count = Number.isFinite(raw) ? Number(raw) : 0;
        if (count <= 0) {
            continue;
        }
        const scale = count / maxCount;
        const barHeight = Math.max(1, Math.round(scale * height));
        const x0 = Math.floor(i * binWidth);
        const x1 = Math.floor((i + 1) * binWidth);
        const w = Math.max(1, x1 - x0);
        const y = height - barHeight;
        histogramCtx.fillRect(x0, y, w, barHeight);
    }

    const rangeMin = Number.isFinite(histogramState.rangeMin) ? histogramState.rangeMin : Number.NaN;
    const rangeMax = Number.isFinite(histogramState.rangeMax) ? histogramState.rangeMax : Number.NaN;
    if (Number.isFinite(rangeMin) && Number.isFinite(rangeMax) && rangeMax > rangeMin) {
        if (rangeMin <= 0 && rangeMax >= 0) {
            const span = rangeMax - rangeMin;
            const zeroOffset = -rangeMin;
            const zeroRatio = zeroOffset / span;
            if (Number.isFinite(zeroRatio)) {
                const x = Math.round(zeroRatio * width);
                const clampedX = Math.max(0, Math.min(width - 1, x));
                histogramCtx.fillStyle = "#f87171";
                histogramCtx.fillRect(clampedX, 0, 1, height);
            }
        }
    }
}

function syncHistogramToViewport(fetchAfterResize) {
    if (!histogramCanvas || !histogramCanvasWrapper) {
        return;
    }
    if (histogramCanvasWrapper.offsetParent === null) {
        return;
    }

    const targetWidth = Math.max(1, Math.floor(histogramCanvasWrapper.clientWidth || histogramCanvasWrapper.offsetWidth || 1));
    const targetHeight = HISTOGRAM_CANVAS_HEIGHT;

    const widthChanged = targetWidth !== histogramState.viewWidth;
    const heightChanged = targetHeight !== histogramState.viewHeight;

    if (widthChanged || heightChanged) {
        histogramState.viewWidth = targetWidth;
        histogramState.viewHeight = targetHeight;
        histogramCanvas.width = targetWidth;
        histogramCanvas.height = targetHeight;
        if (histogramCtx) {
            histogramCtx.imageSmoothingEnabled = false;
        }
        histogramState.bins = [];
        histogramState.maxCount = 0;
        histogramState.total = 0;
        clearHistogramCanvas();
        if (heatmapState.tensor && fetchAfterResize) {
            void fetchHistogram();
        }
        return;
    }

    if (histogramState.bins.length > 0 && histogramState.maxCount > 0) {
        drawHistogram();
    }
}

async function fetchHistogram() {
    if (!heatmapState.tensor || !histogramCanvas) {
        return;
    }
    if (!currentModelPath) {
        return;
    }

    if (histogramState.controller) {
        histogramState.controller.abort();
        histogramState.controller = null;
    }

    const width = Math.max(1, Math.floor(histogramState.viewWidth || histogramCanvas.width || 1));
    const height = Math.max(1, Math.floor(histogramState.viewHeight || histogramCanvas.height || 1));

    const controller = new AbortController();
    histogramState.controller = controller;
    histogramState.fetching = true;
    setHistogramOverlay("Generating histogram…", "loading");

    try {
        const name = encodeURIComponent(heatmapState.tensor.name);
        const params = new URLSearchParams();
        params.set("width", String(width));
        params.set("height", String(height));
        params.set("slice", String(heatmapState.slice));
        appendModelParam(params);
        const response = await fetch(`api/tensors/${name}/histogram?${params.toString()}`, { signal: controller.signal });
        if (!response.ok) {
            throw new Error(`${response.status} ${response.statusText}`.trim());
        }
        const data = await response.json();
        const bins = Array.isArray(data.bins)
            ? data.bins.map((value) => {
                const num = Number(value);
                return Number.isFinite(num) && num > 0 ? num : 0;
            })
            : [];
        const maxCount = Number.isFinite(data.maxCount) ? Number(data.maxCount) : 0;
        const rangeMin = Number.isFinite(data.min) ? Number(data.min) : Number.NaN;
        const rangeMax = Number.isFinite(data.max) ? Number(data.max) : Number.NaN;
        histogramState.tensor = heatmapState.tensor;
        histogramState.slice = typeof data.slice === "number" ? data.slice : heatmapState.slice;
        histogramState.bins = bins;
        histogramState.maxCount = maxCount;
        histogramState.rangeMin = rangeMin;
        histogramState.rangeMax = rangeMax;
        if (Number.isFinite(data.total)) {
            histogramState.total = Number(data.total);
        } else {
            histogramState.total = bins.reduce((sum, value) => sum + value, 0);
        }

        if (bins.length === 0 || maxCount <= 0) {
            clearHistogramCanvas();
            setHistogramOverlay("No histogram data available for this slice.");
            return;
        }

        setHistogramOverlay("", "idle");
        drawHistogram();
    } catch (err) {
        if (controller.signal.aborted) {
            return;
        }
        clearHistogramCanvas();
        setHistogramOverlay(`Failed to load histogram: ${err.message}`, "error");
    } finally {
        if (histogramState.controller === controller) {
            histogramState.controller = null;
        }
        histogramState.fetching = false;
    }
}

function resetHistogram(message = "Select a tensor to generate its histogram.") {
    if (histogramState.controller) {
        histogramState.controller.abort();
        histogramState.controller = null;
    }
    histogramState.tensor = null;
    histogramState.slice = 0;
    histogramState.bins = [];
    histogramState.maxCount = 0;
    histogramState.total = 0;
    histogramState.rangeMin = Number.NaN;
    histogramState.rangeMax = Number.NaN;
    histogramState.fetching = false;
    clearHistogramCanvas();
    setHistogramOverlay(message);
    syncHistogramToViewport(false);
}

function getSliceBounds() {
    let minBound = Number.isFinite(heatmapState.sliceMinBound) ? heatmapState.sliceMinBound : undefined;
    let maxBound = Number.isFinite(heatmapState.sliceMaxBound) ? heatmapState.sliceMaxBound : undefined;

    if (minBound !== undefined && maxBound !== undefined && minBound > maxBound) {
        const tmp = minBound;
        minBound = maxBound;
        maxBound = tmp;
    }

    return { minBound, maxBound };
}

function clampToBounds(value, minBound, maxBound) {
    let result = value;
    if (minBound !== undefined && result < minBound) {
        result = minBound;
    }
    if (maxBound !== undefined && result > maxBound) {
        result = maxBound;
    }
    return result;
}

function roundScaleValue(value) {
    if (!Number.isFinite(value)) {
        return value;
    }
    const factor = 1 / HEATMAP_SCALE_HTML_STEP;
    const rounded = Math.round(value * factor) / factor;
    return Object.is(rounded, -0) ? 0 : rounded;
}

function formatScaleInputValue(value) {
    if (!Number.isFinite(value)) {
        return "";
    }
    const rounded = roundScaleValue(value);
    if (Object.is(rounded, -0)) {
        return "0";
    }
    const fixed = rounded.toFixed(HEATMAP_SCALE_DECIMALS);
    return fixed
        .replace(/(\.\d*?[1-9])0+$/, "$1")
        .replace(/\.0+$/, "");
}

function suppressNativeValidation(input) {
    if (!input) {
        return;
    }
    input.addEventListener("invalid", (event) => {
        event.preventDefault();
    });
}

function sanitizeScale(minValue, maxValue) {
    const { minBound, maxBound } = getSliceBounds();

    let min = Number.isFinite(minValue) ? minValue : undefined;
    if (!Number.isFinite(min)) {
        min = Number.isFinite(heatmapState.scaleMin) ? heatmapState.scaleMin : undefined;
    }
    if (!Number.isFinite(min)) {
        min = Number.isFinite(heatmapState.autoMin) ? heatmapState.autoMin : undefined;
    }
    if (!Number.isFinite(min)) {
        min = minBound;
    }
    if (!Number.isFinite(min)) {
        min = -1;
    }

    let max = Number.isFinite(maxValue) ? maxValue : undefined;
    if (!Number.isFinite(max)) {
        max = Number.isFinite(heatmapState.scaleMax) ? heatmapState.scaleMax : undefined;
    }
    if (!Number.isFinite(max)) {
        max = Number.isFinite(heatmapState.autoMax) ? heatmapState.autoMax : undefined;
    }
    if (!Number.isFinite(max)) {
        max = maxBound;
    }
    if (!Number.isFinite(max)) {
        max = 1;
    }

    min = clampToBounds(min, minBound, maxBound);
    max = clampToBounds(max, minBound, maxBound);

    if (!Number.isFinite(min)) {
        min = -1;
    }
    if (!Number.isFinite(max)) {
        max = 1;
    }

    return { min, max };
}

function setHeatmapScale(minValue, maxValue, options = {}) {
    const { reapply = true, sync = true } = options;
    const { min, max } = sanitizeScale(minValue, maxValue);
    const roundedMin = roundScaleValue(min);
    const roundedMax = roundScaleValue(max);
    if (heatmapState.scaleInitialized) {
        const prevMin = Number.isFinite(heatmapState.scaleMin) ? heatmapState.scaleMin : -1;
        const prevMax = Number.isFinite(heatmapState.scaleMax) ? heatmapState.scaleMax : 1;
        if (Math.abs(prevMin - roundedMin) < HEATMAP_SCALE_EPSILON && Math.abs(prevMax - roundedMax) < HEATMAP_SCALE_EPSILON) {
            if (sync) {
                updateHeatmapHeader();
                syncHeatmapControls();
            }
            return;
        }
    }
    heatmapState.scaleMin = roundedMin;
    heatmapState.scaleMax = roundedMax;
    heatmapState.scaleInitialized = true;

    if (reapply && heatmapState.imageReady && Array.isArray(heatmapState.values) && heatmapState.values.length > 0) {
        updateHeatmapImage(heatmapState.values, heatmapState.scaleMin, heatmapState.scaleMax);
    }

    if (sync) {
        updateHeatmapHeader();
        syncHeatmapControls();
    }
    updateHeatmapUrlState();
}

function sanitizeStepValue(value) {
    if (!Number.isFinite(value) || value <= 0) {
        return HEATMAP_STEP_FALLBACK;
    }
    return Math.max(HEATMAP_MIN_STEP, Math.abs(value));
}

function ensureHeatmapStep() {
    const next = sanitizeStepValue(heatmapState.scaleStep);
    heatmapState.scaleStep = next;
    return next;
}

function commitHeatmapStep(rawValue) {
    const parsed = Number.parseFloat(rawValue);
    const next = Number.isFinite(parsed) ? sanitizeStepValue(parsed) : ensureHeatmapStep();
    heatmapState.scaleStep = next;
    if (heatmapStepInput) {
        heatmapStepInput.value = String(next);
    }
    return next;
}

function adjustHeatmapContrast(direction, magnitude = 1) {
    if (!heatmapState.tensor || !heatmapState.imageReady) {
        return;
    }
    if (direction === 0) {
        return;
    }
    const step = ensureHeatmapStep();
    const appliedMagnitude = Math.max(1, Math.floor(Math.abs(magnitude)));
    const delta = step * appliedMagnitude;
    let nextMin = heatmapState.scaleMin;
    let nextMax = heatmapState.scaleMax;
    if (heatmapState.offsetMode) {
        const offsetDelta = direction > 0 ? delta : -delta;
        nextMin += offsetDelta;
        nextMax += offsetDelta;
    } else if (direction > 0) {
        nextMin += delta;
        nextMax -= delta;
    } else {
        nextMin -= delta;
        nextMax += delta;
    }
    setHeatmapScale(nextMin, nextMax);
}

function syncHeatmapControls() {

    const hasTensor = !!heatmapState.tensor;

    if (!hasTensor) {

        if (heatmapMinInput) {

        if (heatmapMaxInput) {
            heatmapMaxInput.value = formatScaleInputValue(heatmapState.scaleMax);
            heatmapMaxInput.disabled = true;

    }

    const depth = heatmapState.layout && typeof heatmapState.layout.depth === "number" && heatmapState.layout.depth > 0
        ? heatmapState.layout.depth
        : 1;

    if (heatmapSliceInput) {
        heatmapSliceInput.min = "1";

        heatmapSliceInput.value = String(Math.min(depth, heatmapState.slice + 1));

    const ready = heatmapState.imageReady;

    if (heatmapMinInput) {

    if (heatmapMaxInput) {

        heatmapMaxInput.disabled = !ready;

    if (heatmapAutoButton) {
        const hasAuto = Number.isFinite(heatmapState.autoMin) && Number.isFinite(heatmapState.autoMax);
        heatmapAutoButton.disabled = !ready || !hasAuto;
    }
}

function getViewportDimensions() {

function hslToRgb(h, s, l) {
    const hue = ((h % 360) + 360) % 360;
    const chroma = (1 - Math.abs(2 * l - 1)) * s;
    const hp = hue / 60;
    const x = chroma * (1 - Math.abs((hp % 2) - 1));
    let r1 = 0;
    let g1 = 0;
    let b1 = 0;

    if (hp >= 0 && hp < 1) {
        r1 = chroma;
        g1 = x;
    } else if (hp >= 1 && hp < 2) {
        r1 = x;
        g1 = chroma;
    } else if (hp >= 2 && hp < 3) {
        g1 = chroma;
        b1 = x;
    } else if (hp >= 3 && hp < 4) {
        g1 = x;
        b1 = chroma;
    } else if (hp >= 4 && hp < 5) {
        r1 = x;
        b1 = chroma;
    } else {
        r1 = chroma;
        b1 = x;
    }

    const m = l - chroma / 2;
    return {
        r: Math.round((r1 + m) * 255),
        g: Math.round((g1 + m) * 255),
        b: Math.round((b1 + m) * 255),
    };
}

function renderEmptyNote(target, message) {
    if (!target) {

    }
    target.innerHTML = "";
    const note = document.createElement("div");
    note.className = "empty-note";
    note.textContent = message;
    target.appendChild(note);
}

function renderTableMessage(body, span, message) {
    if (!body) {
        return;
    }
    const row = document.createElement("tr");
    row.className = "table-empty";
    const cell = document.createElement("td");
    cell.colSpan = span;
    cell.textContent = message;
    row.appendChild(cell);
    body.appendChild(row);
}

function updateSectionHeaderPaths(displayPath, fullPath) {
    const resolvedDisplay = typeof displayPath === "string" && displayPath.length > 0 ? displayPath : null;
    const resolvedFull = typeof fullPath === "string" && fullPath.length > 0 ? fullPath : null;
    sectionTitles.forEach(({ element, label }) => {
        if (!element) {
            return;
        }
        element.textContent = label;
        if (!resolvedDisplay) {
            return;
        }
        const pathBadge = document.createElement("span");
        pathBadge.className = "model-path";
        if (resolvedFull) {
            pathBadge.title = resolvedFull;
        }
        const pathCode = document.createElement("code");
        pathCode.textContent = resolvedDisplay;
        pathBadge.appendChild(pathCode);
        element.appendChild(pathBadge);
    });
}

function setInfoMessage(message) {
    updateSectionHeaderPaths(currentModelDisplayPath, currentModelFullPath);
    renderEmptyNote(infoCards, message);
}

function setTokenizerMessage(message) {
    renderEmptyNote(tokenizerContent, message);
}

async function fetchJSON(url, options) {
    const res = await fetch(url, options);
    if (!res.ok) {
        const message = await res.text();
        const error = new Error(message || `Request failed: ${res.status}`);
        error.status = res.status;
        throw error;
    }
    if (res.status === 204) {
        return null;
    }
    try {
        return await res.json();
    } catch (err) {
        const error = new Error(`Failed to parse response from ${url}: ${err.message}`);
        error.status = res.status;
        throw error;
    }
}

function formatBytes(bytes) {
    if (bytes === 0) return "0";
    const units = ["B", "KiB", "MiB", "GiB", "TiB"];
    const idx = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
    const value = bytes / Math.pow(1024, idx);
    return `${value.toFixed(value >= 100 ? 0 : value >= 10 ? 1 : 2)} ${units[idx]}`;
}

function formatTooltipInteger(value) {
    if (typeof value !== "number" || !Number.isFinite(value)) {
        return String(value);
    }
    return tooltipIntegerFormatter.format(value);
}

function formatTooltipFloat(value) {
    if (typeof value !== "number" || !Number.isFinite(value)) {
        return String(value);
    }
    const abs = Math.abs(value);
    if (abs !== 0 && (abs < 1e-4 || abs >= 1e6)) {
        return value.toExponential(4);
    }
    return tooltipFloatFormatter.format(value);
}

function createInfoCard(title, value) {
    const div = document.createElement("div");
    div.className = "info-card";
    const heading = document.createElement("h3");
    heading.textContent = title;
    const para = document.createElement("p");
    para.textContent = value;
    div.appendChild(heading);
    div.appendChild(para);
    return div;
}

function setCurrentModel(path, options = {}) {
    const { updateBrowser = true, updateUrl = true } = options;
    const normalized = typeof path === "string" && path.length > 0 ? path : null;
    currentModelPath = normalized;
    modelBrowserState = { ...modelBrowserState, selected: normalized };
    if (updateBrowser) {
        renderModelBrowser();
    }
    if (updateUrl) {
        updateModelUrlState();
    }
}

function renderModelBrowser() {
    if (!modelBrowserContainer) {
        return;
    }

    modelBrowserContainer.innerHTML = "";

    if (modelBrowserRoot) {
        modelBrowserRoot.innerHTML = "";
        const hasRoot = typeof modelBrowserState.root === "string" && modelBrowserState.root.length > 0;
        modelBrowserRoot.hidden = !hasRoot;
        if (hasRoot) {
            const label = document.createElement("span");
            label.textContent = "Root: ";
            const code = document.createElement("code");
            code.textContent = modelBrowserState.root;
            label.appendChild(code);
            modelBrowserRoot.appendChild(label);
        }
    }

    const items = Array.isArray(modelBrowserState.items) ? modelBrowserState.items : [];
    if (items.length === 0) {
        renderEmptyNote(modelBrowserContainer, BROWSER_EMPTY_MESSAGE);
        return;
    }

    const list = document.createElement("ul");
    list.className = "model-list";

    items.forEach((item) => {
        const li = document.createElement("li");
        li.className = "model-item";

        const button = document.createElement("button");
        button.type = "button";
        button.className = "model-button";
        const isSelected = !!item.selected;
        button.dataset.selected = isSelected ? "true" : "false";
        button.disabled = selectingModel;

        const pathLabel = document.createElement("span");
        pathLabel.className = "model-path-entry";
        pathLabel.textContent = item.path;

        const size = document.createElement("span");
        size.className = "model-meta";
        size.textContent = Number.isFinite(item.size) ? formatBytes(item.size) : "N/A";

        button.appendChild(pathLabel);
        button.appendChild(size);

        button.addEventListener("click", () => {
            if (!selectingModel) {
                selectModel(item.path);
            }
        });

        li.appendChild(button);
        list.appendChild(li);
    });

    modelBrowserContainer.appendChild(list);
}

async function loadModelList() {
    if (modelBrowserContainer) {
        renderEmptyNote(modelBrowserContainer, LOADING_MESSAGE);
    }

    try {
        const data = await fetchJSON(withModel("api/models"));
        const rawItems = Array.isArray(data?.items) ? data.items : [];
        const rootPath = typeof data?.root === "string" ? data.root : "";
        let selected = typeof data?.selected === "string" && data.selected.length > 0 ? data.selected : null;
        if (currentModelPath && currentModelPath.length > 0) {
            selected = currentModelPath;
        }
        const items = rawItems.map((item) => ({
            path: item.path,
            name: item.name,
            size: item.size,
        }));
        if (selected && !items.some((item) => item.path === selected)) {
            selected = null;
        }
        modelBrowserState = {
            root: rootPath,
            items: items.map((item) => ({ ...item, selected: !!selected && item.path === selected })),
            selected,
        };
        currentModelPath = selected;
        updateModelUrlState();
        renderModelBrowser();
    } catch (err) {
        modelBrowserState = { root: "", items: [], selected: null };
        if (modelBrowserRoot) {
            modelBrowserRoot.textContent = "";
            modelBrowserRoot.hidden = true;
        }
        if (modelBrowserContainer) {
            renderEmptyNote(modelBrowserContainer, err.message);
        }
    }
}

async function selectModel(path) {
    if (!path || selectingModel) {
        return;
    }
    if (currentModelPath && currentModelPath === path) {
        setActivePage("metadata");
        return;
    }

    selectingModel = true;
    let errorMessage = null;
    try {
        const response = await fetchJSON(`api/models/select?model=${encodeURIComponent(path)}`, { method: "POST" });
        const selectedPath = typeof response?.selected === "string" && response.selected.length > 0
            ? response.selected
            : path;
        setCurrentModel(selectedPath, { updateBrowser: false });
        pendingHeatmapState.applied = true;
        pendingHeatmapState.tensor = null;
        pendingHeatmapState.slice = null;
        pendingHeatmapState.min = null;
        pendingHeatmapState.max = null;
        pendingHeatmapState.x = null;
        pendingHeatmapState.y = null;
        await refreshAll();
        await loadModelList();
        setActivePage("metadata");
    } catch (err) {
        errorMessage = err.status === 409 ? NO_MODEL_MESSAGE : err.message;
    } finally {
        selectingModel = false;
        renderModelBrowser();
        if (errorMessage && modelBrowserContainer) {
            const note = document.createElement("div");
            note.className = "empty-note";
            note.textContent = errorMessage;
            modelBrowserContainer.appendChild(note);
        }
    }
}

function resetViewer(message = NO_MODEL_MESSAGE) {
    currentModelDisplayPath = null;
    currentModelFullPath = null;
    setInfoMessage(message);
    kvBody.innerHTML = "";
    renderTableMessage(kvBody, 3, message);
    setTokenizerMessage(message);
    tensorBody.innerHTML = "";
    renderTableMessage(tensorBody, 6, message);
    tensorData = [];
    tokenizerState = { ...tokenizerState, offset: 0, total: 0 };
    refreshHeatmapTensorSelect();
    resetHistogram(message);
    resetHeatmap(message);
}

async function refreshAll() {
    if (!currentModelPath) {
        resetViewer();
        return;
    }

    updateModelUrlState();
    currentModelDisplayPath = null;
    currentModelFullPath = null;
    setInfoMessage(LOADING_MESSAGE);
    kvBody.innerHTML = "";
    renderTableMessage(kvBody, 3, LOADING_MESSAGE);
    setTokenizerMessage(LOADING_MESSAGE);
    tensorBody.innerHTML = "";
    renderTableMessage(tensorBody, 6, LOADING_MESSAGE);
    tokenizerState = { ...tokenizerState, offset: 0, total: 0 };
    resetHeatmap();

    await loadInfo();
    await loadKv();
    await loadTokenizer(0);

async function loadInfo() {
    try {
        const info = await fetchJSON(withModel("api/info"));
        infoCards.innerHTML = "";

        if (info && typeof info === "object") {
            const displayPath = typeof info.relativePath === "string" && info.relativePath.length > 0
                ? info.relativePath
                : info.modelPath;
            currentModelDisplayPath = displayPath && displayPath.length > 0 ? displayPath : null;
            currentModelFullPath = typeof info.modelPath === "string" && info.modelPath.length > 0
                ? info.modelPath

            updateSectionHeaderPaths(currentModelDisplayPath, currentModelFullPath);

            const cards = [
                ["File size", Number.isFinite(info.fileSize) ? formatBytes(info.fileSize) : "N/A"],
                ["GGUF version", info.ggufVersion ?? "N/A"],

                ["Tensors", info.nTensors ?? "N/A"],

                ["Data offset", Number.isFinite(info.dataOffset) ? String(info.dataOffset) : "N/A"],
            ];
